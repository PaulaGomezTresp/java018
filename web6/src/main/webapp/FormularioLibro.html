<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>


<form action="DestinoLibro.jsp">

<input type="text" name="ISBN" id="ISBN"/>
</p>
<p>
<label for="Titulo"> Título: </label>
<input type="text" name="Titulo" id="Titulo"/>
</p>
<p>

</p>
<p>

</select>

<p>

</p>
